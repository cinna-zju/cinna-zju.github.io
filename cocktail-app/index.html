<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="鸡尾酒百科 - 探索经典与现代鸡尾酒的世界">
  <title>Y's Bar</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/modals.css">
  <link rel="stylesheet" href="./css/animations.css">
</head>
<body>
  <header class="navbar">
    <div class="navbar-container">
      <h1 class="navbar-title">Y's Bar</h1>
      <div class="bartender-area">
        <svg class="bartender-icon" width="40" height="48" viewBox="0 0 40 48" fill="none">
          <!-- 酒保帽子 -->
          <ellipse cx="20" cy="8" rx="14" ry="3" fill="#FFC107"/>
          <path d="M10 8 Q10 2 14 1 L26 1 Q30 2 30 8 Z" fill="#FFC107"/>
          <!-- 头部 -->
          <circle cx="20" cy="14" r="7" fill="#F5DEB3" stroke="#D4A574" stroke-width="1"/>
          <!-- 眼睛 -->
          <circle cx="17" cy="13" r="1.2" fill="#333"/>
          <circle cx="23" cy="13" r="1.2" fill="#333"/>
          <!-- 微笑 -->
          <path d="M17 16 Q20 19 23 16" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>
          <!-- 身体 -->
          <path d="M13 21 Q12 22 11 28 L29 28 Q28 22 27 21 Z" fill="#2C2C2C" stroke="#444" stroke-width="0.5"/>
          <!-- 领结 -->
          <polygon points="18,22 20,24 22,22 20,21" fill="#E74C3C"/>
          <!-- 左手拿摇酒壶 -->
          <path d="M11 24 Q6 22 4 26" stroke="#F5DEB3" stroke-width="2.5" stroke-linecap="round"/>
          <!-- 摇酒壶主体 -->
          <rect x="1" y="22" width="7" height="12" rx="2" fill="#C0C0C0" stroke="#999" stroke-width="0.5"/>
          <rect x="2" y="20" width="5" height="3" rx="1" fill="#D4D4D4" stroke="#999" stroke-width="0.5"/>
          <!-- 右手 -->
          <path d="M29 24 Q34 22 36 26" stroke="#F5DEB3" stroke-width="2.5" stroke-linecap="round"/>
          <!-- 围裙 -->
          <path d="M14 28 L13 40 Q13 42 15 42 L25 42 Q27 42 27 40 L26 28 Z" fill="#4A4A4A" stroke="#555" stroke-width="0.5"/>
          <path d="M14 28 Q20 30 26 28" stroke="#555" stroke-width="1" fill="none"/>
          <!-- 围裙口袋 -->
          <rect x="17" y="33" width="6" height="5" rx="1" fill="#555" stroke="#666" stroke-width="0.5"/>
        </svg>
        <div class="speech-bubble">
          <span id="greeting-text">今晚想喝点什么？</span>
        </div>
      </div>
      <button id="filter-toggle-mobile" class="filter-toggle-mobile" aria-label="筛选">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="6" x2="20" y2="6"></line>
          <line x1="8" y1="12" x2="20" y2="12"></line>
          <line x1="12" y1="18" x2="20" y2="18"></line>
        </svg>
      </button>
      <div class="search-wrapper">
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="搜索鸡尾酒..."
          aria-label="搜索鸡尾酒"
        >
        <button id="search-clear" class="search-clear" aria-label="清除搜索">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <button id="fun-recommend" class="fun-recommend-btn" aria-label="趣味推荐">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3c0 1.66 1.34 3 3 3s3-1.34 3-3a3 3 0 0 0-3-3z"></path>
          <path d="M19 9h-2a5 5 0 0 0-5 5v2"></path>
          <path d="M5 9h2a5 5 0 0 1 5 5v2"></path>
          <circle cx="12" cy="19" r="3"></circle>
        </svg>
        <span>I feel lucky</span>
      </button>
    </div>
  </header>

  <main class="main-content">
    <aside id="filter-panel" class="filter-panel">
      <div class="filter-header">
        <h2 class="filter-title">筛选</h2>
        <div class="filter-header-actions">
          <button id="filter-toggle" class="filter-toggle-btn" aria-label="展开/折叠筛选器">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <button id="filter-close" class="filter-close" aria-label="关闭筛选器">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="filter-body" id="filter-body">
        <div class="filter-group">
          <h3 class="filter-group-title">基酒</h3>
          <div class="filter-options" id="base-spirit-filters">
            <label class="filter-tag">
              <input type="checkbox" name="baseSpirit" value="伏特加">
              <span>伏特加</span>
            </label>
            <label class="filter-tag">
              <input type="checkbox" name="baseSpirit" value="金酒">
              <span>金酒</span>
            </label>
            <label class="filter-tag">
              <input type="checkbox" name="baseSpirit" value="朗姆酒">
              <span>朗姆酒</span>
            </label>
            <label class="filter-tag">
              <input type="checkbox" name="baseSpirit" value="威士忌">
              <span>威士忌</span>
            </label>
            <label class="filter-tag">
              <input type="checkbox" name="baseSpirit" value="龙舌兰">
              <span>龙舌兰</span>
            </label>
            <label class="filter-tag">
              <input type="checkbox" name="baseSpirit" value="白兰地">
              <span>白兰地</span>
            </label>
            <label class="filter-tag">
              <input type="checkbox" name="baseSpirit" value="利口酒">
              <span>利口酒</span>
            </label>
          </div>
        </div>

        <div class="filter-group">
          <h3 class="filter-group-title">风味</h3>
          <div class="filter-options" id="flavor-filters">
            <span class="filter-tag" data-flavor="清爽">清爽</span>
            <span class="filter-tag" data-flavor="果味">果味</span>
            <span class="filter-tag" data-flavor="甜味">甜味</span>
            <span class="filter-tag" data-flavor="酸味">酸味</span>
            <span class="filter-tag" data-flavor="苦味">苦味</span>
            <span class="filter-tag" data-flavor="香料">香料</span>
            <span class="filter-tag" data-flavor="奶油">奶油</span>
          </div>
        </div>

        <div class="filter-group">
          <h3 class="filter-group-title">酒精度</h3>
          <div class="filter-options" id="alcohol-filters">
            <span class="filter-tag" data-level="低">低 (&lt;15%)</span>
            <span class="filter-tag" data-level="中">中 (15-25%)</span>
            <span class="filter-tag" data-level="高">高 (&gt;25%)</span>
          </div>
        </div>

        <div class="filter-actions">
          <button id="filter-clear" class="btn btn-secondary">清除筛选</button>
        </div>
      </div>
    </aside>
    <section class="results-bar">
      <p class="results-count">共 <span id="cocktail-count">0</span> 款鸡尾酒</p>
    </section>

    <section id="cocktail-grid" class="cocktail-grid">
      <!-- 鸡尾酒卡片将由 JavaScript 动态渲染 -->
    </section>

    <section id="empty-state" class="empty-state hidden">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <p>未找到匹配的鸡尾酒</p>
      <button class="btn btn-primary" id="empty-clear">清除筛选条件</button>
    </section>
  </main>

  <dialog id="detail-modal" class="detail-modal">
    <article class="detail-content">
      <header class="detail-header">
        <button id="detail-close" class="detail-close" aria-label="关闭详情">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <figure class="detail-image">
        <img id="detail-img" src="" alt="">
      </figure>

       <section class="detail-info">
         <div class="detail-name-row">
           <h2 id="detail-name" class="detail-name"></h2>
           <span id="detail-popularity" class="detail-popularity">
             <svg class="detail-flame" viewBox="0 0 24 24" fill="var(--flame-color)">
               <path d="M12 23c-3.866 0-7-3.134-7-7 0-3.127 2.504-5.834 4.5-7.5.37-.308.872-.308 1.242 0 .37.308.872.308 1.242 0C13.496 10.166 16 12.873 16 16c0 3.866-3.134 7-7 7zm0-18.5C8.5 7 5 10.5 5 14c0 2.761 2.239 5 5 5s5-2.239 5-5c0-3.5-3.5-7-3-9.5z"/>
               <path d="M12 20c-2.21 0-4-1.79-4-4 0-1.657 1.343-3.5 2.5-4.5.276-.24.676-.24.952 0C12.657 12.5 14 14.343 14 16c0 2.21-1.79 4-4 4z" opacity="0.6"/>
             </svg>
             <span class="detail-popularity-label"></span>
             <span class="detail-popularity-count"></span>
           </span>
         </div>
         <p id="detail-name-en" class="detail-name-en"></p>

        <div class="detail-attributes">
          <span class="attribute">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
            <span id="detail-spirit"></span>
          </span>
          <span class="attribute">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            <span id="detail-alcohol"></span>%
          </span>
          <span class="attribute">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 6v6l4 2"></path>
            </svg>
            <span id="detail-difficulty"></span>
          </span>
          <span class="attribute">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
              <line x1="6" y1="1" x2="6" y2="4"></line>
              <line x1="10" y1="1" x2="10" y2="4"></line>
              <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
            <span id="detail-glass"></span>
          </span>
        </div>

        <div id="detail-flavors" class="detail-flavors"></div>
      </section>

      <section class="detail-section">
        <h3 class="detail-section-title">配方材料</h3>
        <ul id="detail-ingredients" class="detail-ingredients"></ul>
      </section>

      <section class="detail-section">
        <h3 class="detail-section-title">装饰物</h3>
        <p id="detail-garnish" class="detail-garnish"></p>
      </section>

      <section class="detail-section">
        <h3 class="detail-section-title">调制步骤</h3>
        <ol id="detail-steps" class="detail-steps"></ol>
      </section>

      <section class="detail-section animation-section">
        <h3 class="detail-section-title">调酒动画</h3>
        <div class="animation-player">
          <div class="animation-canvas-wrapper">
            <canvas id="animation-canvas" width="300" height="250"></canvas>
          </div>
          <div class="animation-progress">
            <div class="progress-bar">
              <div id="progress-fill" class="progress-fill"></div>
            </div>
            <span id="step-indicator" class="step-indicator">步骤 0/0</span>
          </div>
          <div class="animation-controls">
            <button id="anim-prev" class="btn btn-secondary anim-btn" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <button id="anim-play" class="btn btn-primary anim-btn anim-play-btn">
              <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <svg id="pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
              </svg>
            </button>
            <button id="anim-next" class="btn btn-secondary anim-btn" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </section>

      <section class="detail-section">
        <h3 class="detail-section-title">背景故事</h3>
        <p id="detail-history" class="detail-history"></p>
      </section>
    </article>
  </dialog>

  <!-- 趣味推荐模态框 -->
  <dialog id="recommend-modal" class="recommend-modal">
    <article class="recommend-content">
      <header class="recommend-header">
        <h2 class="recommend-title">How's your mood?</h2>
        <button id="recommend-close" class="recommend-close" aria-label="关闭推荐">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <section class="recommend-section">
        <h3 class="recommend-section-title">选择你的守护动物</h3>
        <div class="animal-grid" id="animal-grid">
          <button class="animal-btn" data-animal="lion">🦁</button>
          <button class="animal-btn" data-animal="rabbit">🐰</button>
          <button class="animal-btn" data-animal="fox">🦊</button>
          <button class="animal-btn" data-animal="bear">🐻</button>
          <button class="animal-btn" data-animal="owl">🦉</button>
          <button class="animal-btn" data-animal="dolphin">🐬</button>
          <button class="animal-btn" data-animal="butterfly">🦋</button>
          <button class="animal-btn" data-animal="snake">🐍</button>
          <button class="animal-btn" data-animal="eagle">🦅</button>
          <button class="animal-btn" data-animal="panda">🐼</button>
          <button class="animal-btn" data-animal="wolf">🐺</button>
          <button class="animal-btn" data-animal="hummingbird">🐦</button>
        </div>
      </section>

      <section class="recommend-section">
        <h3 class="recommend-section-title">选择你喜欢的颜色</h3>
        <div class="color-grid" id="color-grid">
          <button class="color-btn" data-color="red" style="--color: #E74C3C">🔴</button>
          <button class="color-btn" data-color="orange" style="--color: #F39C12">🟠</button>
          <button class="color-btn" data-color="yellow" style="--color: #F1C40F">🟡</button>
          <button class="color-btn" data-color="green" style="--color: #2ECC71">🟢</button>
          <button class="color-btn" data-color="blue" style="--color: #3498DB">🔵</button>
          <button class="color-btn" data-color="purple" style="--color: #9B59B6">🟣</button>
          <button class="color-btn" data-color="white" style="--color: #ECF0F1">⚪</button>
          <button class="color-btn" data-color="brown" style="--color: #8B4513">🟤</button>
        </div>
      </section>

      <section class="recommend-section">
        <button id="recommend-btn" class="btn btn-primary recommend-action-btn" disabled>
          I'm lucky
        </button>
      </section>

      <section class="recommend-result" id="recommend-result">
        <!-- 推荐结果将在这里显示 -->
      </section>
    </article>
  </dialog>

  <script src="./js/constants.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/canvas.js"></script>
  <script src="./js/renderer.js"></script>
  <script src="./js/filter.js"></script>
  <script src="./js/recommend.js"></script>
  <script src="./js/animation.js"></script>
  <script src="./js/events.js"></script>
  <script src="./js/bartender.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
